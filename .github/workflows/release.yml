# Publishes a Foundry release when a version tag (v1.2.3) is pushed.
# Foundry installs from the manifest URL in module.json, which points at the latest release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags, to tell whether this is the newest version

      - name: Check module.json matches the tag
        run: |
          version=$(jq -r .version module.json)
          download=$(jq -r .download module.json)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::module.json version $version does not match tag $GITHUB_REF_NAME"; exit 1; }
          case "$download" in
            */releases/download/$GITHUB_REF_NAME/module.zip) ;;
            *) echo "::error::module.json download URL does not point at this release: $download"; exit 1 ;;
          esac

      - name: Build module.zip
        run: zip -r module.zip module.json README.md scripts styles templates lang

      # Foundry's manifest URL follows the "latest" release, so a delayed run for an older tag must not take it over
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          latest=--latest
          [ "$newest" = "$GITHUB_REF_NAME" ] || latest=--latest=false
          gh release create "$GITHUB_REF_NAME" module.json module.zip --title "$GITHUB_REF_NAME" --generate-notes "$latest"
